[project]
name = "mayprogulka"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hopesofbuzzy", email = "nurbaevdaniar0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "bcrypt==4.0.1",
    "fastapi[standard]>=0.143.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.5",
]

[project.scripts]
mayprogulka = "mayprogulka:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "mayprogulka.entrypoint:app"
